name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: No secret keys in the public build config
        run: node scripts/check-public-config.mjs
      - name: Build (Mode Demo, so e2e does not depend on the live database)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run e2e

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # the official image includes contrib (dblink), which the lock tests use
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Schema tests (fresh, applied twice, upgrade from v0.2)
        run: bash supabase/tests/run.sh
