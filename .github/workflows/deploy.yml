name: Deploy to GitHub Pages

# Builds the app on every push to master and publishes it at https://shinx2ran.github.io/Woombad/
# by pushing the build output to the gh-pages branch (GitHub Pages serves that branch).
# Online mode: add repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# (Settings -> Secrets and variables -> Actions), then push or run this workflow manually.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (sub-path /Woombad/)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: SPA fallback for deep links (GitHub Pages serves 404.html for unknown paths)
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Publish ${{ github.sha }}'
