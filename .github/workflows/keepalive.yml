name: Keep database awake

# Free Supabase projects are paused after about a week with too little database activity. This calls
# public.keepalive() three times a day with the public key from .env.production; it updates one heartbeat row
# (read-only pings are reported not to count since 2026) and returns the server time. If the project is paused anyway, the job fails and GitHub emails the
# repository owner: open the Supabase dashboard and press "Resume project".
# Note: GitHub turns off scheduled workflows in a public repository after 60 days without commits (it emails a
# warning first); press "Enable workflow" under Actions -> Keep database awake to switch it back on.

on:
  schedule:
    - cron: '17 1,9,17 * * *' # 08:17, 16:17 and 00:17 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env.production
          sparse-checkout-cone-mode: false
      - name: Call keepalive()
        run: |
          set -a; . ./.env.production; set +a
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $VITE_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{}' || true)
            if [ "$status" = 200 ]; then echo "Database awake at $(cat response.txt)"; exit 0; fi
            echo "Attempt $attempt: HTTP $status $(cat response.txt 2>/dev/null)"
            sleep 30
          done
          echo "::error::Supabase did not answer. If the project is paused, open the Supabase dashboard and press Resume project."
          exit 1
