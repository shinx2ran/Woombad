<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>LBS Manajemen</title>
<meta name="description" content="Contoh tampilan (mockup) aplikasi manajemen kontraktor kebun sawit: progres pekerjaan, BAPP & termin, uang, alat berat, jejak sparepart, dan jejak input. Semua data fiktif.">
<meta name="theme-color" content="#1F6F4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LBS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one phone column (max 430px) that scrolls as the document; sticky header, fixed tab bar, bottom sheets.
   Palette: hijau sawit accent on a cool-grey-green ground; status colours separate from the accent; violet marks "Contoh fitur AI". */
:root {
  --bg: #F4F6F2; --surface: #FFFFFF; --surface-2: #EDF1EA; --surface-3: #E3E8E0;
  --text: #171A17; --muted: #5B625C; --faint: #8C948E; --border: #D8DED5;
  --accent: #1F6F4A; --accent-soft: #E2F1E8; --accent-ink: #FFFFFF;
  --info: #2F6FB5; --info-2: #1C4A7E; --info-soft: #E4EEF9;
  --warn: #B7791F; --warn-soft: #FBF1DC; --danger: #B23B3B; --danger-soft: #F9E3E3;
  --ai: #6B4FBB; --ai-soft: #EEE9FA; --summary: #FFF8DC; --summary-border: #EADFA8;
  --chart-in: #1F6F4A; --chart-out: #A3ACA5; --grid: #E1E6DE;
  --ramp-1: #1F6F4A; --ramp-2: #3A8A62; --ramp-3: #5FA67E; --ramp-4: #8FC3A6; --ramp-5: #C2DFCF;
  --shadow: 0 10px 30px rgba(23, 26, 23, 0.16);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1311; --surface: #171D19; --surface-2: #1F2722; --surface-3: #28322B;
    --text: #ECEFEA; --muted: #9AA39C; --faint: #6F7872; --border: #2A332D;
    --accent: #4CAF83; --accent-soft: #173A2B; --accent-ink: #0F1311;
    --info: #6AA2E6; --info-2: #3F78B8; --info-soft: #17283D;
    --warn: #E0A94A; --warn-soft: #3A2E14; --danger: #E06C6C; --danger-soft: #3E1C1C;
    --ai: #A48CF0; --ai-soft: #2A2342; --summary: #2E2A14; --summary-border: #4A4320;
    --chart-in: #4CAF83; --chart-out: #55605A; --grid: #273029;
    --ramp-1: #4CAF83; --ramp-2: #3E9470; --ramp-3: #31785B; --ramp-4: #265C47; --ramp-5: #1C4234;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1311; --surface: #171D19; --surface-2: #1F2722; --surface-3: #28322B;
  --text: #ECEFEA; --muted: #9AA39C; --faint: #6F7872; --border: #2A332D;
  --accent: #4CAF83; --accent-soft: #173A2B; --accent-ink: #0F1311;
  --info: #6AA2E6; --info-2: #3F78B8; --info-soft: #17283D;
  --warn: #E0A94A; --warn-soft: #3A2E14; --danger: #E06C6C; --danger-soft: #3E1C1C;
  --ai: #A48CF0; --ai-soft: #2A2342; --summary: #2E2A14; --summary-border: #4A4320;
  --chart-in: #4CAF83; --chart-out: #55605A; --grid: #273029;
  --ramp-1: #4CAF83; --ramp-2: #3E9470; --ramp-3: #31785B; --ramp-4: #265C47; --ramp-5: #1C4234;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 106.25%; -webkit-text-size-adjust: 100%; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── shell ─────────────────────────────────────────────── */
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative;
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 480px) { .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 56px; display: flex; align-items: center; gap: 6px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.hdr .ttl { flex: 1; min-width: 0; font-weight: 700; font-size: 1.06rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 8px; }
.hdr .ttl small { display: block; font-weight: 500; font-size: .72rem; color: var(--muted); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ibtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; position: relative; color: var(--text); }
.ibtn:active { background: var(--surface-2); }
.ibtn svg { width: 24px; height: 24px; }
.badge { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: var(--accent-ink); font-size: .68rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .85rem; display: grid; place-items: center; flex: none; }
.av.s { width: 28px; height: 28px; font-size: .72rem; background: var(--accent-soft); color: var(--accent); }
.view { padding-top: 12px; padding-bottom: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: grid; gap: 12px; }
.stack > * { min-width: 0; }
.sub { color: var(--muted); font-size: .82rem; }
.meta { color: var(--muted); font-size: .76rem; line-height: 1.4; }
.tiny { color: var(--muted); font-size: .8rem; line-height: 1.35; }
.strong { font-weight: 650; }
.right { text-align: right; }
.danger-t { color: var(--danger); } .warn-t { color: var(--warn); } .ok-t { color: var(--accent); } .info-t { color: var(--info); } .ai-t { color: var(--ai); }
.sec { font-size: .88rem; font-weight: 650; color: var(--muted); margin: 4px 0 -4px; display: flex; align-items: center; gap: 8px; }

/* ── cards, rows, chips ────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; min-width: 0; }
.card[id] { scroll-margin-top: calc(68px + env(safe-area-inset-top, 0px)); }
.card.tap { cursor: pointer; } .card.tap:active { background: var(--surface-2); }
.card.summary { background: var(--summary); border-color: var(--summary-border); }
.card.danger { border-color: var(--danger); } .card.warn { border-color: var(--warn); }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.ch h2 { font-size: .95rem; font-weight: 700; }
.row { display: flex; gap: 12px; align-items: center; min-height: 48px; padding: 10px 0; border-top: 1px solid var(--border); min-width: 0; }
.row:first-of-type, .row.nb { border-top: 0; }
.row.tap { cursor: pointer; } .row.tap:active { background: var(--surface-2); margin-inline: -8px; padding-inline: 8px; border-radius: 10px; }
.row > .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; font-size: .95rem; }
.chev { color: var(--faint); flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 650; line-height: 1.2; white-space: nowrap; vertical-align: middle; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.muted { background: var(--surface-2); color: var(--muted); }
.chip.ai { background: var(--ai-soft); color: var(--ai); }
.chip.wrap { white-space: normal; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.fchip { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: .82rem; font-weight: 600; white-space: nowrap; }
.fchip.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 40px; border-radius: 9px; font-size: .82rem; font-weight: 600; color: var(--muted); padding: 0 6px; }
.seg button.sel { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 650; font-size: .95rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.outline { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { min-height: 40px; font-size: .82rem; padding: 0 14px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:active { filter: brightness(.94); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1; }
.link { color: var(--accent); font-weight: 650; font-size: .88rem; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; }
.num { text-decoration: underline dotted; text-decoration-color: var(--faint); text-underline-offset: 4px; cursor: pointer; }
.num, button.chip { position: relative; }
.num::after, button.chip::after { content: ""; position: absolute; left: -4px; right: -4px; top: -10px; bottom: -10px; }
.big { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; font-variant-numeric: normal; }
.mid { font-size: 1.3rem; font-weight: 700; line-height: 1.2; font-variant-numeric: normal; }
.kv { display: grid; grid-template-columns: fit-content(55%) minmax(0, 1fr); gap: 4px 12px; font-size: .88rem; }
@media (max-width: 340px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv dd { text-align: left; } }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-weight: 600; }
.tbl { width: 100%; border-collapse: collapse; font-size: .82rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: .74rem; }
.tbl td { padding: 7px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl td.r, .tbl th.r { text-align: right; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.scrollx { overflow-x: auto; margin-inline: -16px; padding-inline: 16px; }

/* tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 12px; display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; cursor: pointer; min-width: 0; }
.tile:active { background: var(--surface-2); }
.tile.span { grid-column: 1 / -1; }
.tile .tl { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 650; color: var(--muted); letter-spacing: .01em; }
.tile .tl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex: none; }
.tile.warn .tl .dot { background: var(--warn); }
.tile .big { font-size: clamp(1.35rem, 7vw, 1.7rem); white-space: nowrap; line-height: 1.1; }
.tile.danger .big { color: var(--danger); } .tile.warn .big { color: var(--warn); }
.tile .ts { font-size: .82rem; color: var(--muted); line-height: 1.35; }
.tile .tm { display: grid; gap: 4px; font-size: .74rem; color: var(--muted); }
.tile .tm .track { height: 6px; }
.tile .tf { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: .8rem; font-weight: 650; color: var(--accent); }
.tile .tf svg { width: 16px; height: 16px; flex: none; }
.tile.span .tf { border-top: 0; padding-top: 0; }
@media (max-width: 380px) { .tile { padding: 14px 12px 12px; } .tile .tl { font-size: .74rem; white-space: nowrap; } }
@media (max-width: 340px) {
  .tiles { gap: 10px; }
  .tile { padding: 12px 10px 10px; }
  .tile .tl { font-size: .72rem; } .tile .tl .dot { display: none; }
  .tile .ts { font-size: .76rem; } .tile .tf { font-size: .74rem; }
}
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 340px) { .cols3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cols3 .mid { font-size: 1.05rem; }

/* three-tone progress */
.bars3 { display: grid; gap: 5px; }
.bars3 .b { display: grid; grid-template-columns: 56px 1fr 44px; align-items: center; gap: 8px; font-size: .74rem; color: var(--muted); }
.bars3 .b b { text-align: right; color: var(--text); font-weight: 650; }
.track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; position: relative; }
.track.tickable { overflow: visible; }
.track .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 1px; }
.glance .row { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "name pct delta" "spk spk spk" "bar bar bar" "meta meta meta"; gap: 4px 8px; align-items: center; padding: 10px 0; }
.spkline { font-size: .78rem; font-weight: 650; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.glance .row .spk { grid-area: spk; margin-top: -4px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.glance .row .name { grid-area: name; font-weight: 650; font-size: .95rem; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.glance .row .pct { grid-area: pct; font-weight: 700; font-size: 1.05rem; font-variant-numeric: normal; }
.glance .row .delta { grid-area: delta; }
.glance .row .bar { grid-area: bar; }
.glance .row .m { grid-area: meta; }
.track.lg { height: 14px; border-radius: 7px; } .track.lg i { border-radius: 7px; } .track.lg .tick { top: -4px; bottom: -4px; }
.track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.track i.info { background: var(--info); } .track i.info2 { background: var(--info-2); } .track i.warn { background: var(--warn); } .track i.danger { background: var(--danger); } .track i.muted { background: var(--faint); }
.bars3.lg .b { grid-template-columns: 64px 1fr 52px; font-size: .82rem; }
.bars3.lg .track { height: 12px; border-radius: 6px; } .bars3.lg .track i { border-radius: 6px; }
.bars3.lg .b b { font-size: 1rem; }

/* segmented thin bar (part to whole) */
.segbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.segbar i { display: block; height: 100%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); fill: var(--muted); font-size: 11px; }
.chart text.v { fill: var(--text); font-weight: 600; }
.chart line.grid { stroke: var(--grid); stroke-width: 1; }
.chart line.base { stroke: var(--border); stroke-width: 1; }
.chart line.ref { stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 4 4; }
.legend { display: flex; gap: 14px; font-size: .74rem; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }

/* photo placeholder */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.photo { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; background: var(--surface-2); }
.photo svg { display: block; width: 100%; height: auto; }
.photo .cap { font-size: .66rem; color: var(--muted); padding: 4px 6px; line-height: 1.3; }
.photo.lg { border-radius: 14px; }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0 0 0 4px; }
.tl li { position: relative; padding: 0 0 18px 30px; min-height: 40px; }
.tl li::before { content: ""; position: absolute; left: 9px; top: 22px; bottom: -2px; width: 2px; background: var(--border); }
.tl li:last-child::before { display: none; }
.tl .dot { position: absolute; left: 0; top: 2px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .66rem; font-weight: 700; border: 2px solid var(--border); background: var(--surface); color: var(--muted); }
.tl .done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tl .cur .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl .future .dot { border-style: dashed; }
.tl .broken .dot { border-color: var(--danger); border-style: dashed; color: var(--danger); background: var(--danger-soft); }
.tl .broken .lbl { color: var(--danger); }
.tl .lbl { font-weight: 650; font-size: .92rem; }
.tl .who { font-size: .8rem; color: var(--muted); }
.tl .note { font-size: .8rem; margin-top: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .tl .cur .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px var(--accent-soft); } 50% { box-shadow: 0 0 0 8px transparent; } }
}

/* approval chain */
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .8rem; }
.chain .av.s { background: var(--accent); color: var(--accent-ink); }
.chain .av.s.open { background: var(--surface); color: var(--muted); border: 2px dashed var(--border); }
.chain .arr { color: var(--faint); }

/* audit */
.audit .row { align-items: flex-start; }
.audit .a { font-size: .88rem; } .audit .a b { font-weight: 650; }
.audit .chg { text-decoration: line-through; color: var(--muted); }

/* spreadsheet overlay */
.xls { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-family: var(--mono); font-size: .72rem; }
.xls .bar { background: var(--surface-2); padding: 6px 10px; font-weight: 700; border-bottom: 1px solid var(--border); font-family: var(--font); }
.xls .scrollx { margin: 0; padding: 0; overflow-x: auto; }
.xls table { border-collapse: collapse; width: max-content; min-width: 100%; }
.xls td, .xls th { border: 1px solid var(--border); padding: 5px 6px; white-space: nowrap; text-align: left; font-weight: 400; }
.xls th { background: var(--surface-2); color: var(--muted); text-align: center; }
.xls td.hl { background: #FFF2A8; color: #171A17; position: relative; }
.xls td.hl::after { content: ""; position: absolute; top: 0; right: 0; border: 5px solid transparent; border-top-color: #D03B3B; border-right-color: #D03B3B; }
.xls .cmt { margin: 10px; padding: 8px 10px; background: #FFF2A8; color: #171A17; border: 1px solid #E2CF62; border-radius: 6px; font-family: var(--font); font-size: .76rem; }
.flip { display: flex; margin-bottom: 10px; }

/* sheets, toast, fab, tabbar */
.backdrop { position: fixed; inset: 0; background: rgba(10, 14, 11, 0.5); z-index: 40; }
.sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; max-height: 88vh; max-height: 88dvh;
  background: var(--surface); border-radius: 22px 22px 0 0; z-index: 41; display: flex; flex-direction: column; box-shadow: var(--shadow);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .handle { height: 28px; display: grid; place-items: center; cursor: pointer; flex: none; }
.backdrop, .sheet .handle, .sheet .sh { touch-action: none; }

// 6-month cash chart as horizontal grouped bars (Masuk = accent, Keluar = muted): one scale, the value at every bar tip
function cashChart(months) {
  const W = 360, rowH = 34, padL = 30, padR = 46, padT = 16; const H = padT + rowH * months.length + 4;
  const max = Math.max(...months.flatMap((m) => [m.in, m.out])) / 1e6; const step = 300; const top = Math.ceil(max / step) * step;
  const x = (v) => padL + (W - padL - padR) * (v / top); const bh = 10;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kas masuk dan keluar per bulan, Mei sampai Oktober, dalam juta rupiah">`;
  for (let v = 0; v <= top; v += step) s += `<line class="${v ? 'grid' : 'base'}" y1="${padT - 4}" y2="${H - 4}" x1="${x(v).toFixed(1)}" x2="${x(v).toFixed(1)}"/><text x="${x(v).toFixed(1)}" y="${padT - 7}" text-anchor="middle" font-size="9.5">${v ? fmtInt(v) : '0'}</text>`;
  months.forEach((m, i) => {
    const y0 = padT + rowH * i + 4; const a = m.in / 1e6, b = m.out / 1e6;
    s += `<text x="${padL - 6}" y="${(y0 + bh + 4).toFixed(1)}" text-anchor="end" font-size="11">${m.month}</text>`;
    s += `<rect x="${padL}" y="${y0}" width="${(x(a) - padL).toFixed(1)}" height="${bh}" rx="3" fill="var(--chart-in)"/><text class="v" x="${(x(a) + 4).toFixed(1)}" y="${(y0 + bh - 1).toFixed(1)}" font-size="10">${fmtInt(Math.round(a))}</text>`;
    s += `<rect x="${padL}" y="${y0 + bh + 2}" width="${(x(b) - padL).toFixed(1)}" height="${bh}" rx="3" fill="var(--chart-out)"/><text x="${(x(b) + 4).toFixed(1)}" y="${(y0 + bh * 2 + 1).toFixed(1)}" font-size="10">${fmtInt(Math.round(b))}</text>`;
  });
  return s + '</svg><div class="legend"><span><span class="sw" style="background:var(--chart-in)"></span>Masuk (juta Rp, masuk rekening)</span><span><span class="sw" style="background:var(--chart-out)"></span>Keluar</span></div>';
}
function fuelBars(arr, ref) {
  const max = Math.max(...arr, ref) * 1.1; const refTop = (1 - ref / max) * 100;
  return `<div class="fuelbars" role="img" aria-label="Solar per jam 14 hari terakhir, batas ${fmtDec(ref, 1)}">${arr.map((v) => `<i class="${v > ref * 1.12 ? 'hot' : ''}" style="height:${(v / max * 100).toFixed(1)}%" title="${fmtDec(v, 1)}"></i>`).join('')}<div class="ref" style="top:${refTop.toFixed(1)}%"></div></div><div class="legend"><span>17 Okt</span><span style="margin-inline:auto"><span style="display:inline-block;width:18px;border-top:2px dashed var(--danger);vertical-align:middle;margin-right:4px"></span>rata-rata 20 ton ${fmtDec(ref, 1)} L/jam</span><span>30 Okt</span></div>`;
}

let sheetOpen = null; let sheetReturnFocus = null;
function openSheet(kind, title, body, opts = {}) {
  const label = String(title).replace(/<[^>]*>/g, '').replace(/&amp;/g, '&');
  const prev = document.querySelector('.sheet .sb'); const keep = sheetOpen && sheetOpen.kind === kind && prev ? prev.scrollTop : 0; const still = sheetOpen ? ' still' : '';
  if (!sheetOpen) sheetReturnFocus = document.activeElement;
  sheetOpen = { kind, arg: opts.arg };
  document.getElementById('layer').innerHTML = `<div class="backdrop${still}" data-act="close"></div><section class="sheet${still}" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1"><div class="handle" data-act="close"><i></i></div><div class="sh"><h2>${title}</h2>${opts.head || ''}<button class="ibtn" data-act="close" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="sb"><div class="stack">${body}</div></div></section>`;
  document.body.style.overflow = 'hidden';
  const sb = document.querySelector('.sheet .sb'); if (sb && keep) sb.scrollTop = keep;
  if (!still) { const s = document.querySelector('.sheet'); if (s) s.focus({ preventScroll: true }); }
}
function closeSheet() { if (!sheetOpen) return; sheetOpen = null; document.getElementById('layer').innerHTML = ''; document.body.style.overflow = ''; if (sheetReturnFocus && sheetReturnFocus.focus && document.contains(sheetReturnFocus)) { try { sheetReturnFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } sheetReturnFocus = null; }

// Jadwal: satu baris per SPK dari tanggal mulai ke selesai; isi = fisik, tanda = rencana, garis tegak = hari ini
function scheduleCard() {
  const a = activeProjects(); const W = 360, rowH = 36, padL = 118, padR = 40, padT = 18, padB = 16; const H = padT + rowH * a.length + padB;
  const t0 = dateOf('2026-08-01').getTime(), t1 = dateOf('2027-02-01').getTime(); const x = (iso) => padL + (W - padL - padR) * ((dateOf(iso).getTime() - t0) / (t1 - t0));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Jadwal proyek berjalan per nomor SPK, dengan progres fisik dan rencana">`;
  for (const m of ['2026-09-01', '2026-10-01', '2026-11-01', '2026-12-01', '2027-01-01']) s += `<line class="grid" x1="${x(m).toFixed(1)}" x2="${x(m).toFixed(1)}" y1="${padT - 4}" y2="${H - padB}"/><text x="${x(m).toFixed(1)}" y="${padT - 7}" text-anchor="middle" font-size="10">${MONTHS[parts(m).m - 1]}</text>`;
  a.forEach((p, i) => { const y = padT + rowH * i + 8; const xs = x(p.period_start), xe = x(p.period_end); const pp = Math.min(100, projPct(p)); const tone = planTone(p);
    const fill = tone === 'ok' ? 'var(--accent)' : tone === 'warn' ? 'var(--warn)' : 'var(--danger)';
    s += `<text x="${padL - 6}" y="${y + 6}" text-anchor="end" font-size="10.5" class="v">${esc(p.short_name)}</text><text x="${padL - 6}" y="${y + 18}" text-anchor="end" font-size="9.5">SPK ${esc(p.spk_no.split('/').slice(0, 2).join('/'))}</text>`;
    s += `<rect x="${xs.toFixed(1)}" y="${y}" width="${(xe - xs).toFixed(1)}" height="16" rx="4" fill="var(--surface-2)"/>`;
    s += `<rect x="${xs.toFixed(1)}" y="${y}" width="${((xe - xs) * pp / 100).toFixed(1)}" height="16" rx="4" fill="${fill}"/>`;
    const xp = xs + (xe - xs) * projPlan(p) / 100; s += `<rect x="${(xp - 1).toFixed(1)}" y="${y - 3}" width="2" height="22" fill="var(--text)"/>`;
    s += `<text x="${xe + 6}" y="${y + 13}" font-size="11" class="v">${fmtPct(pp, 0)}</text>`; });
  const xt = x(DEMO_DATE); s += `<line class="ref" x1="${xt.toFixed(1)}" x2="${xt.toFixed(1)}" y1="${padT - 4}" y2="${H - padB + 2}"/><text x="${xt.toFixed(1)}" y="${H - 3}" font-size="9.5" text-anchor="middle" fill="var(--danger)">hari ini</text>`;
  s += '</svg>';
  return `<section class="card"><div class="ch"><h2>Jadwal &amp; progres</h2><span class="meta">${fmtDateShort(DEMO_DATE)}</span></div>${s}<div class="tiny">Batang = masa kontrak (mulai → selesai) · isi = fisik terpasang · tanda tegak = rencana per hari ini · garis putus = hari ini</div></section>`;
}

const STATUS = { operating: ['ok', 'Beroperasi'], standby: ['muted', 'Standby'], service: ['info', 'Servis'], broken: ['danger', 'Rusak'] };
function unitKind(e) { return /Excavator/.test(e.type) ? 'excavator' : /Dump/.test(e.type) ? 'dump' : 'lain'; }
function unitProblem(e) { return e.status !== 'operating' || (e.flags && e.flags.length) || (e.next_service && (e.meter === 'HM' ? e.next_service.remaining <= 40 : e.next_service.remaining <= 400)); }
function unitSub(e) {
  const parts = [];
  if (e.status === 'broken') parts.push(`<span class="danger-t strong">RUSAK sejak ${fmtDateShort(e.broken_since)} (${daysAgo(e.broken_since)} hari)</span>`, esc(e.status_note), poApproved() ? `PO disetujui ${esc(OWNER_NAME)} ${APPROVAL_TIME} · perkiraan jalan ${fmtDateShort(e.expected_running)}` : '<span class="danger-t">PO menunggu manajemen</span>');
  else if (e.status === 'service') parts.push(`<span class="info-t strong">SERVIS</span>`, esc(e.status_note));
  else if (e.status === 'standby') parts.push('Standby', esc(e.status_note || ''));
  else {
    parts.push(e.meter === 'HM' ? `HM ${fmtInt(e.meter_value)}` : `km ${fmtInt(e.meter_value)}`);
    if (e.l_per_hm) parts.push(e.id === 'EX-07' ? `<span class="danger-t strong">${fmtDec(e.l_per_hm, 1)} L/jam ⚠</span> <span class="meta">(rata-rata ${fmtDec(DATA.equipment_summary.fleet_avg_l_per_hm_20t, 1)})</span>` : `${fmtDec(e.l_per_hm, 1)} L/jam`);

  }
  return parts.filter(Boolean).join(' · ');
}

  else if (base === 'proyek') { const p = project(arg); title = p ? esc(p.short_name) : 'Proyek'; back = 'proyek'; body = viewProyekDetail(arg); }
  else if (base === 'laporan') { title = 'Laporan harian <small>Semitau · 30 Okt · Pak Ujang</small>'; back = 'proyek-SPK-047'; body = viewLaporan(); }
  else if (base === 'mandor') { back = 'beranda'; body = viewMandor(); }
  else if (base === 'uang') body = viewUang();
  else if (base === 'alat' && !arg) { STATE.seg.alat = 'unit'; body = viewAlat(); }
  else if (base === 'gudang') { STATE.seg.alat = 'gudang'; body = viewAlat(); }
  else if (base === 'alat') { title = esc(arg); back = 'alat'; body = viewAlatDetail(arg); }
  else if (base === 'sparepart') { title = 'Jejak barang'; back = 'gudang'; body = viewSparepart(arg); }
  else if (base === 'jejak') body = viewJejak();
  else body = notFound();
  if (!title) title = (TITLES[base] || (() => DATA.meta.app_name))();
  const unread = unreadCount();
  const hdr = `<header class="hdr app-header">${back ? `<button class="ibtn" data-go="${back}" aria-label="Kembali">${I.back}</button>` : ''}<div class="ttl" style="${back ? 'padding-left:0' : ''}">${title}</div>
    <button class="ibtn" data-act="notif" aria-label="Pemberitahuan">${I.bell}${unread ? `<span class="badge">${unread}</span>` : ''}</button>
    <button class="ibtn" data-act="theme-toggle" aria-label="Ganti tema">${isDark() ? I.sun : I.moon}</button>
    <button class="ibtn" data-act="tentang" aria-label="Tentang contoh ini"><span class="av">${esc(OWNER_INITIAL)}</span></button></header>`;
  const tabs = `<nav class="tabbar"><div class="strip" data-act="tentang">${esc(DATA.meta.disclaimer)}</div><div class="tabs">${TABS.map(([k, l, ic]) => `<button class="${tab === k ? 'sel' : ''}" data-tab="${k}" data-go="${k}" aria-current="${tab === k ? 'page' : 'false'}">${ic}<span>${l}</span></button>`).join('')}</div></nav>`;
  const fab = AI_ON && !back && base !== 'mandor' ? `<button class="fab" data-act="tanya" aria-label="Tanya data">${I.chat} Tanya</button>` : '';
  document.getElementById('app').innerHTML = `<div class="app">${hdr}<main class="view${r !== lastRoute ? ' enter' : ''}" data-route="${esc(r)}">${body}</main>${fab}${tabs}</div>`; lastRoute = r;
  if (sheetOpen && opts.refreshSheet !== false) refreshSheet();
}
function refreshSheet() { const s = sheetOpen; if (!s) return; if (s.kind === 'decision') sheetDecision(s.arg); else if (s.kind === 'tanya') { /* keep */ } }

// ── Actions ───────────────────────────────────────────────────────────────────────────────────────────────────────
const ACTIONS = {
  close: () => closeSheet(),
  notif: () => sheetNotif(),
  'notif-read': () => { STATE.notifRead = true; render({ refreshSheet: false }); sheetNotif(); },
  tentang: () => sheetTentang(),
  tanya: () => sheetTanya(null),
  'tanya-q': (i) => sheetTanya(Number(i)),
  decide: (id) => sheetDecision(id),
  approve: (id) => decide(id, 'approved'),
  reject: (id) => sheetReject(id),
  'reject-confirm': (arg) => { const [id, reason] = arg.split('|'); decide(id, 'rejected', reason); },
  termin: (arg) => { const [pid, code] = arg.split('|'); sheetTermin(pid, code); },
  trace: (key) => { STATE.open.traceView = 'app'; sheetTrace(key); },
  traceview: (v) => { STATE.open.traceView = v; sheetTrace(sheetOpen && sheetOpen.arg); },
  nominal: (key) => sheetNominal(key),
  wa: (key) => sheetWa(key),
  photo: (cap) => sheetPhoto(cap),
  toast: (msg) => toast(msg),
  copy: (text) => { const done = () => toast('Teks disalin', 'ok'); try { navigator.clipboard.writeText(text).then(done, () => toast('Tidak bisa menyalin di sini; teks bisa dipilih manual.')); } catch (e) { toast('Tidak bisa menyalin di sini; teks bisa dipilih manual.'); } },
  seg: (arg) => { const [k, v] = arg.split('|'); STATE.seg[k] = v; if (k === 'alat') { navigate(v === 'gudang' ? 'gudang' : 'alat', { keepScroll: true }); return; } render({ keepScroll: true }); },
  toggle: (k) => { if (k === 'decidedOpen' || k === 'orangOpen') STATE[k] = !STATE[k]; else STATE.open[k] = !STATE.open[k]; render(); },
  chain: (k) => { STATE.chainOpen[k] = !STATE.chainOpen[k]; render(); },
  link: (l) => { closeSheet(); if (l.startsWith('unit:')) navigate('alat-' + l.slice(5)); else if (l.startsWith('chain:')) navigate('sparepart-' + l.slice(6)); else if (l.startsWith('approval:')) sheetDecision(l.slice(9)); else if (l.startsWith('project:')) navigate('proyek-' + l.slice(8)); else if (l.startsWith('report:')) navigate('laporan-' + l.slice(7)); else if (l === 'gudang') navigate('gudang'); else navigate(l); },
  'go-anchor': (arg) => { const [route, id] = arg.split('|'); navigate(route); const el = document.getElementById(id); if (el) el.scrollIntoView({ block: 'start' }); },
  signal: () => { if (STATE.synced || STATE.sending) return; STATE.sending = true; render({ keepScroll: true }); setTimeout(() => { STATE.sending = false; STATE.synced = true; render({ keepScroll: true }); toast(`Laporan Pak Toni sampai di HP manajemen.`, 'ok'); }, 1200); },
  theme: (t) => { applyTheme(t); render({ refreshSheet: false }); sheetTentang(); },
  'theme-toggle': () => { applyTheme(isDark() ? 'light' : 'dark'); render({ keepScroll: true }); },
  reset: () => { STATE = INITIAL_STATE(); closeSheet(); navigate('beranda'); toast('Demo dikembalikan ke awal'); },
  gudangset: (k) => { STATE.seg.gudangQ = k; render({ keepScroll: true }); },
};
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); navigate(go.getAttribute('data-go')); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'FORM') return;
  const act = el.getAttribute('data-act'); const fn = ACTIONS[act]; if (fn) { e.preventDefault(); fn(el.getAttribute('data-arg')); }
});
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-act="tanya-form"]'); if (!f) return; e.preventDefault(); const v = (document.getElementById('tanya-input') || {}).value || ''; if (v.trim()) sheetTanya(null, v.trim()); });
document.addEventListener('compositionend', (e) => { if (e.target.id === 'gudang-q') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('input', (e) => { if (e.target.id === 'gudang-q' && !e.isComposing) { STATE.seg.gudangQ = e.target.value; const pos = e.target.selectionStart; render({ keepScroll: true }); const el = document.getElementById('gudang-q'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } } } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet(); return; } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-go], [role="button"][data-act]')) { e.preventDefault(); e.target.click(); } });

// ── Splash & start ────────────────────────────────────────────────────────────────────────────────────────────────
function splash() {
  const el = document.createElement('div'); el.className = 'splash'; el.setAttribute('role', 'button'); el.setAttribute('aria-label', 'Lewati');
  el.innerHTML = `<div class="logo">${esc(DATA.meta.company_short)}</div><h1>Selamat pagi, ${esc(DATA.meta.greeting)}</h1><div class="sub">${esc(fmtLong(DEMO_DATE))} · ${DEMO_TIME}</div><div class="fp">${I.finger}<span>Masuk otomatis · ${esc(OWNER_NAME)}</span></div><div class="strip">${esc(DATA.meta.disclaimer)}</div>`;
  document.body.appendChild(el);
  const off = () => { if (el.parentNode) el.parentNode.removeChild(el); };
  el.addEventListener('click', off); setTimeout(off, 1500);
}
function selfCheck() {
  const T = totals(); const c = eqCounts();
  const checks = [['kontrak berjalan', T.contract, 5470000000], ['belum ditagih', Math.round(T.unbilled), 1461800000], ['piutang', receivablesTotal(), 817500000], ['masuk Okt', octInTotal(), 1137292500], ['keluar Okt', octOutTotal(), 1094642000], ['beroperasi', c.operating, 15], ['standby', c.standby, 2], ['servis', c.service, 1], ['rusak', c.broken, 1], ['solar armada L', fleetFuelL(), 35903], ['EX-07 L/jam', Math.round(unit('EX-07').oct_fuel_l / unit('EX-07').oct_hm * 10) / 10, 28.6], ['BT belum ditagih', projUnbilled(project('SPK-047')), 539000000], ['kas', cashTotal(), 1862450000], ['kewajiban 30 hari', obligationsTotal(), 532400000], ['kas keluar hari ini', todayOutTotal(), 59750000]];
  let ok = true; for (const [l, a, b] of checks) { const pass = Math.abs(a - b) < 1000; console.assert(pass, `self-check ${l}: ${a} != ${b}`); if (!pass) ok = false; }
  for (const p of DATA.projects) { const sum = p.termin.reduce((s, t) => s + t.amount, 0); const pass = sum === p.contract_value; console.assert(pass, `termin ${p.id} ${sum} != ${p.contract_value}`); if (!pass) ok = false; }
  console.log(ok ? 'LBS self-check OK' : 'LBS self-check FAILED');
  return ok;
}
(function start() {
  const saved = storeGet('lbs-theme'); if (saved) applyTheme(saved);
  const r = parseRoute(location.hash); STATE.route = r;
  render();
  if (r === 'beranda' && !/\bnosplash\b/.test(location.search)) splash();
  selfCheck();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && window.top === window.self) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* tanpa service worker juga jalan */ } }
})();
</script>
